# Monitor the monitor: alert if the live daemon stops publishing status.
# Cron jitter is fine here — this path guards uptime, not detection latency.
name: Watchdog
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check status freshness
        id: fresh
        run: |
          set -e
          STATUS=$(curl -fsS "https://raw.githubusercontent.com/${{ github.repository }}-data/data/status.json" || echo "")
          if [ -z "$STATUS" ]; then
            echo "state=missing" >> "$GITHUB_OUTPUT"
            echo "Status file missing — daemon has never published or branch is gone."
            exit 0
          fi
          GEN=$(echo "$STATUS" | jq -r '.generated_at // empty')
          if [ -z "$GEN" ]; then
            echo "state=malformed" >> "$GITHUB_OUTPUT"; exit 0
          fi
          AGE=$(( $(date -u +%s) - $(date -u -d "$GEN" +%s) ))
          echo "generated_at=$GEN age_seconds=$AGE"
          if [ "$AGE" -gt 1800 ]; then
            echo "state=stale" >> "$GITHUB_OUTPUT"
            echo "age=$((AGE / 60))" >> "$GITHUB_OUTPUT"
          else
            echo "state=ok" >> "$GITHUB_OUTPUT"
          fi
      - name: Alert if stale
        if: steps.fresh.outputs.state == 'stale' || steps.fresh.outputs.state == 'malformed'
        env:
          TOKEN: ${{ secrets.TPW_TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TPW_TELEGRAM_CHAT_ID }}
        run: |
          MSG="🔴 Third Pole Watch OFFLINE: status.json is ${{ steps.fresh.outputs.state }} (last publish ${{ steps.fresh.outputs.age }} min ago). The live watch daemon needs attention."
          echo "$MSG"
          if [ -n "$TOKEN" ] && [ -n "$CHAT" ]; then
            curl -fsS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d chat_id="${CHAT}" --data-urlencode text="$MSG" > /dev/null
          else
            echo "Telegram secrets not configured; printed only."
          fi
