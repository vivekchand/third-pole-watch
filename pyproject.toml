[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thirdpole-watch"
version = "0.0.1"
description = "Open seismic watch for Himalayan mass movements (glacier collapses, debris flows)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "truststore>=0.8",
    "obspy>=1.4",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tpw = "thirdpole.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
